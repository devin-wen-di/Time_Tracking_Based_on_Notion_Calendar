<body><div class="wrap">
<header class="top"><div class="brand"><div class="brand-mark" aria-hidden="true">◷</div><div><div class="eyebrow">TIME ATLAS · 时间地图</div><h1>时间使用分析</h1><div class="sub">看见时间的去向，为下一段时间留白</div></div></div><div class="actions"><button class="secondary theme-toggle" id="themeToggle" type="button" aria-label="切换为深色模式" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">深色模式</span></button><button class="secondary" id="allocationOpen" type="button">时间分配</button><button class="secondary allocation-toggle" id="allocationToggle" type="button" aria-pressed="false">显示时间分配：关</button><button id="pickFiles">导入 CSV 文件</button><button class="secondary" id="pickFolder">重新导入文件夹</button><button class="secondary" id="exportCsv">导出当前明细</button></div></header>
<dialog id="allocationDialog" class="allocation-dialog" aria-labelledby="allocationTitle"><div class="allocation-inner"><div class="allocation-head"><div><h2 id="allocationTitle">时间分配</h2><div class="allocation-info">勾选类别并设置每日目标，可拖动手柄调整顺序。</div></div><button type="button" class="secondary" id="allocationClose" aria-label="关闭">✕</button></div><div id="allocationList" class="allocation-list"></div><div id="allocationError" class="allocation-error" role="status"></div><div class="allocation-footer"><span id="allocationSummary"></span><button type="button" id="allocationSave">保存设置</button></div><p class="allocation-info">未勾选类别计入“其他”；目标总时长不能超过 24 小时。</p></div></dialog><div id="status" class="status">正在载入最新导出数据…</div>

<div id="app"></div>
<div class="foot">统计规则：优先使用 Time allotted；缺失时按结束减开始补算。每个 CSV 文件作为一个类别。重叠时长保留并提示；未标日期记录计入时长汇总，但不进入趋势。时间趋势按天显示 14 天，明细保留已有的 WK # 和年份。</div>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), colors=['#4778e8','#20a58b','#f1a33b','#8864d9','#e26868','#31a9c3','#b77b50','#78904d','#cb6ba5','#67778a','#bea23c'];
const themeSettingKey='__time_dashboard_theme__',darkThemeMarker='#101722',lightThemeMarker='#ffffff';
let categoryColors={};try{categoryColors=JSON.parse(localStorage.getItem('timeDashboardColors')||'{}')}catch{}let selectedRing='yesterday';
let allocation={selected:[],hours:{},show:false},draftAllocation=null,allocationSaving=Promise.resolve();
function loadAllocation(){let key=Object.keys(categoryColors).find(k=>k.startsWith('__allocation_v1__:'));if(!key){allocation={selected:[],hours:{},show:false};return}try{let v=JSON.parse(decodeURIComponent(key.slice(18)));allocation={selected:Array.isArray(v.selected)?v.selected.filter(x=>typeof x==='string'):[],hours:v.hours&&typeof v.hours==='object'?v.hours:{},show:v.show===true}}catch{allocation={selected:[],hours:{},show:false}}}
function encodeAllocation(){for(let k of Object.keys(categoryColors))if(k.startsWith('__allocation_v1__:'))delete categoryColors[k];categoryColors['__allocation_v1__:'+encodeURIComponent(JSON.stringify(allocation))]='#000000'}
loadAllocation();
let currentTheme=categoryColors[themeSettingKey]===darkThemeMarker?'dark':'light';
function applyTheme(theme){currentTheme=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=currentTheme;let toggle=$('#themeToggle');toggle.setAttribute('aria-pressed',String(currentTheme==='dark'));toggle.setAttribute('aria-label',currentTheme==='dark'?'切换为浅色模式':'切换为深色模式');toggle.querySelector('.theme-icon').textContent=currentTheme==='dark'?'☀':'☾';toggle.querySelector('.theme-label').textContent=currentTheme==='dark'?'浅色模式':'深色模式'}
function persistSettings(){encodeAllocation();let csv='category,color\r\n'+Object.entries(categoryColors).map(([k,v])=>'"'+k.replaceAll('"','""')+'",'+v).join('\r\n');try{localStorage.setItem('timeDashboardColors',JSON.stringify(categoryColors))}catch{}if(location.protocol==='http:'&&location.hostname==='127.0.0.1'){allocationSaving=allocationSaving.catch(()=>{}).then(()=>fetch('/api/colors',{method:'POST',headers:{'Content-Type':'text/csv'},body:csv}).then(r=>{if(!r.ok)throw Error('设置保存失败')}));return allocationSaving}return Promise.resolve()}
applyTheme(currentTheme);
let rows=[], importedAt='', failure='', duplicateCount=0, syncAt='', syncFailure='';let planningDay=new Date();planningDay=new Date(planningDay.getFullYear(),planningDay.getMonth(),planningDay.getDate());let nowForTrend=new Date();let trendWindowEnd=new Date(nowForTrend.getFullYear(),nowForTrend.getMonth(),nowForTrend.getDate());
const status=$('#status'), app=$('#app');
const fmt=(n,d=2)=>Number.isFinite(n)?n.toFixed(d):'0.00', dateFmt=d=>new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit'}).format(d), minsFmt=n=>`${fmt(n/60)} 小时`, clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function parseDate(s){if(!s)return null;let d=new Date(s);return Number.isNaN(+d)?null:d}
function periodBounds(period){let now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),days=period==='yesterday'?1:period==='last3'?3:7,offset=period==='yesterday'?1:0,start=new Date(today),end=new Date(today);start.setDate(start.getDate()-offset-days+1);end.setDate(end.getDate()-offset+1);return{start,end}}
function getBounds(){let now=new Date(),kind=$('#range').value;if(kind==='default'||kind==='yesterday')return periodBounds('yesterday');if(kind==='today'||kind==='last3'||kind==='last7'||kind==='last14'||kind==='last21'||kind==='last30'){let days=kind==='today'?1:kind==='last3'?3:kind==='last7'?7:kind==='last14'?14:kind==='last21'?21:30,start=new Date(now.getFullYear(),now.getMonth(),now.getDate());start.setDate(start.getDate()-days+1);return{start,end:new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)}}let a=$('#from').value,b=$('#to').value;if(!a||!b)return null;let start=new Date(a+'T00:00:00'),end=new Date(b+'T00:00:00');end.setDate(end.getDate()+1);return start<end?{start,end}:null}
function getColor(name,index=0){if(categoryColors[name])return categoryColors[name];let hash=0;for(let ch of String(name))hash=((hash<<5)-hash+ch.charCodeAt(0))|0;return colors[Math.abs(hash)%colors.length]}
async function saveColor(name,value){categoryColors[name]=value;await persistSettings();draw()}
$('#themeToggle').onclick=async()=>{let next=currentTheme==='dark'?'light':'dark';categoryColors[themeSettingKey]=next==='dark'?darkThemeMarker:lightThemeMarker;applyTheme(next);await persistSettings()};
function unrecordedFor(bounds,list){let effectiveEnd=new Date(Math.min(+bounds.end,+new Date()));effectiveEnd=new Date(Math.max(+bounds.start,+effectiveEnd));let spans=list.filter(r=>r.start&&r.end&&r.end>r.start).map(r=>[Math.max(+r.start,+bounds.start),Math.min(+r.end,+effectiveEnd)]).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);let covered=0,start=null,end=null;for(let span of spans){if(start===null)[start,end]=span;else if(span[0]<=end)end=Math.max(end,span[1]);else{covered+=end-start;[start,end]=span}}if(start!==null)covered+=end-start;return Math.max(0,(effectiveEnd-bounds.start)/3600000-covered/3600000)}
function inRange(r,b){return !r.start||(b&&r.start>=b.start&&r.start<b.end)}
function chosenRows(){let b=getBounds(),cat=$('#category').value;return rows.filter(r=>(!b||inRange(r,b))&&(cat==='all'||r.category===cat))}
function overlaps(list){let valid=list.filter(r=>r.start&&r.end&&r.end>r.start).sort((a,b)=>a.start-b.start);let active=[];for(let r of valid){active=active.filter(x=>x.end>r.start);if(active.length){if(!r.issues.includes('与其他活动重叠'))r.issues.push('与其他活动重叠');for(let x of active)if(!x.issues.includes('与其他活动重叠'))x.issues.push('与其他活动重叠')}active.push(r)}}
function isoWeek(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function keyFor(r,grain){if(!r.start)return '';let d=r.start,y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');if(grain==='month')return `${y}-${m}`;if(grain==='week'){if(r.wk)return `wk:${r.year||y}:${r.wk}`;let mon=new Date(y,d.getMonth(),d.getDate());mon.setDate(mon.getDate()-(mon.getDay()+6)%7);return `${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`}return `${y}-${m}-${day}`}
function keyLabel(k,g){if(g==='month')return k;if(g==='week'){if(k.startsWith('wk:')){let [,year,wk]=k.split(':');return `${year} · WK ${wk.replace(/^WK\s*/i,'')}`}let d=new Date(k+'T00:00:00');return `${dateFmt(d)}周 · ISO ${isoWeek(d)}`}return dateFmt(new Date(k+'T00:00:00'))}
let donutTransitionToken=0;

    drawImmediate();
    return;

      if(token!==donutTransitionToken)return;

      const degrees=Math.min(359.99,Math.max(.01,eased*360));

        ?(progress>=1?'linear-gradient(transparent,transparent)':progress<=0?'none':`conic-gradient(from 0deg, transparent 0deg ${degrees}deg, black ${degrees}deg 360deg)`)

      svg.style.webkitMaskImage=mask;

      svg.style.transformOrigin='center center';

    }

    if(token!==donutTransitionToken)return;
    drawImmediate();

      next.style.maskImage='linear-gradient(transparent,transparent)';
      next.style.webkitMaskImage=next.style.maskImage;
      next.style.transform='scale(.87)';
      next.style.transformOrigin='center center';
      next.style.opacity='.35';

      if(token!==donutTransitionToken)return;
      next.style.maskImage='';next.style.webkitMaskImage='';next.style.transform='';next.style.opacity='';
      });

}
function drawImmediate(){
  const selectedCategory=$('#category').value,b=getBounds(),list=chosenRows(),dated=list.filter(r=>r.start&&r.duration!==null),categories=[...new Set(rows.map(r=>r.category))].sort((a,b)=>a.localeCompare(b,'zh-CN')),scopedCategories=[...new Set(rows.filter(r=>selectedCategory==='all'||r.category===selectedCategory).map(r=>r.category))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
  $('#category').innerHTML='<option value="all">全部类别</option>'+categories.map(c=>`<option value="${escAttr(c)}">${esc(c)}</option>`).join('');$('#category').value=categories.includes(selectedCategory)?selectedCategory:'all';
  const catTotals=new Map(scopedCategories.map(c=>[c,0]));let total=0;for(let r of list)if(r.duration!==null){catTotals.set(r.category,(catTotals.get(r.category)||0)+r.duration);total+=r.duration}

  const rangeText=b?`${dateFmt(b.start)} – ${dateFmt(new Date(b.end-1))}`:'请填写有效日期范围';$('#rangeLabel').textContent=rangeText;
  if(!rows.length){app.innerHTML=`<div class="panel no-data"><h2>还没有导入日程数据</h2><p class="muted">启动同步程序后，最新 CSV 会自动载入。</p></div>`;return}
  if(!b){app.innerHTML='<div class="panel empty">请设置完整且有效的自定义开始和结束日期。</div>';return}
  const overlapCount=list.filter(r=>r.issues.includes('与其他活动重叠')).length;let notice=overlapCount?`<div class="notice">所选范围内有 ${overlapCount} 条记录涉及时间重叠。统计保留原始时长，不会自动扣减；累计时长可能高于实际经过时间。</div>`:'';

  app.innerHTML=`<section class="cards"><article class="metric"><div class="label">总记录时长</div><div class="value">${fmt(total)} 小时</div><div class="hint">${list.length} 条记录；日期缺失但有时长的记录也计入</div></article><article class="metric"><div class="label">类别数</div><div class="value">${catTotals.size}</div><div class="hint">按导入的 CSV 文件分类</div></article><article class="metric"><div class="label">估算未记录时长</div><div class="value">${fmt(unrecorded)} 小时</div><div class="hint">全部类别 · 截至当前时刻的无活动区间</div></article><article class="metric"><div class="label">异常记录</div><div class="value">${anomalies}</div><div class="hint">日期、时长、起止差异或重叠</div></article></section>
  <div class="insight"><span class="insight-icon" aria-hidden="true">✦</span><p>${top?`在当前范围内，<strong>${esc(top[0])}</strong> 是记录时间最多的类别，共 <strong>${fmt(top[1])} 小时</strong>。`:`当前范围内尚无可统计的活动时长。`} <span class="muted">${comparison}（仅比较有日期的活动）。点击类别可查看记录。</span></p></div>
  <section class="grid"><article class="panel"><div class="head"><div><h2>类别时间占比</h2><small>${$('#range').value==='default'?'点击环切换昨天、近3天、近7天 · 汇总含日期缺失记录':'单位：小时 · 点击类别筛选明细'}</small></div></div><div id="donut"></div></article><article class="panel"><div class="head"><div><h2>时间变化趋势</h2><small>全部历史数据 · 每次显示连续14天</small></div></div><div id="trend"></div></article></section>

  if($('#range').value==='default')drawMultiRing();else drawDonut([...catTotals].map(([name,value])=>({name,value})),selectedCategory==='all'?unrecorded:0);

function safeUrl(value){try{let u=new URL(value);return u.protocol==='https:'||u.protocol==='http:'?u.href:''}catch{return ''}}
function localDayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function clockLabel(d){return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
function planningMarkup(){
  const day=new Date(planningDay),next=new Date(day);next.setDate(next.getDate()+1);
  const activities=rows.filter(r=>r.start&&r.start<next&&((r.end&&r.end>day)||(!r.end&&r.start>=day))).sort((a,b)=>a.start-b.start);
  const events=activities.map(r=>{let start=r.start<day?'跨日':clockLabel(r.start),end=r.end?(r.end>=next?'次日':clockLabel(r.end)):'结束未知';return `<div class="plan-event"><span class="plan-time">${esc(start)} – ${esc(end)}</span><span class="plan-dot" style="background:${getColor(r.category)}"></span><div class="plan-info"><strong>${esc(r.event)}</strong><small>${esc(r.category)}${r.issues.length?' · '+esc(r.issues.join('、')):''}</small></div>${safeUrl(r.url)?`<a class="detail-link" href="${escAttr(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">Notion ↗</a>`:''}</div>`}).join('');

  let gaps=[],incomplete=activities.some(r=>!r.end||r.end<=r.start);

  let gapText=incomplete?'部分活动缺少有效结束时间，暂无法可靠计算空档。':+high<=+now?'这是已过去的日期，请选择今天或未来日期查看空档。':'08:00–22:00 没有 30 分钟以上的空档。';
  let gapHtml=gaps.map(([a,b])=>`<div class="gap-item"><span class="plan-time">${clockLabel(new Date(a))} – ${clockLabel(new Date(b))}</span><span>${fmt((b-a)/3600000)} 小时</span></div>`).join('');
  return `<article class="panel planning"><div class="head plan-head"><div><span class="section-kicker">DAY PLANNER</span><h2>日程与可安排时间</h2><small>查看一天的全部日程，寻找适合安排新活动的空档</small></div><div class="plan-controls"><button class="secondary" id="planPrev" aria-label="前一天">‹</button><input id="planDate" type="date" value="${localDayKey(day)}" aria-label="选择日期"><button class="secondary" id="planNext" aria-label="后一天">›</button><button class="secondary" id="planToday">今天</button></div></div><div class="plan-grid"><div class="plan-pane"><div class="plan-title">当天日程 · ${activities.length} 项</div><div class="plan-list">${events||'<div class="plan-empty">这一天没有已同步的日程</div>'}</div></div><div class="plan-pane"><div class="plan-title">可安排空档 · ${gaps.length} 段</div><div class="plan-list">${gapHtml||`<div class="plan-empty">${gapText}</div>`}</div><div class="plan-note">按 08:00–22:00 的活动起止时间计算，今天仅显示当前时刻之后、至少 30 分钟的空档。显示全部类别；新增日程请在 Notion 中完成后重新同步。</div></div></div></article>`;
}

function allocationCompare(a,b){if(allocation.show){let ai=allocation.selected.indexOf(a.name),bi=allocation.selected.indexOf(b.name);if(ai>=0||bi>=0)return ai<0?1:bi<0?-1:ai-bi}return b.value-a.value||a.name.localeCompare(b.name,'zh-CN')}

function setStatus(){let parts=[];if(importedAt)parts.push(`最近成功导入：${new Date(importedAt).toLocaleString()}`);if(syncAt)parts.push(`Notion 最近同步：${new Date(syncAt).toLocaleString()}`);if(failure||syncFailure){status.className='status error';let errorText=[failure?`导入失败：${failure}`:'',syncFailure?`Notion 同步失败：${syncFailure}`:''].filter(Boolean).join(' · ');status.textContent=`${errorText}${parts.length?'；'+parts.join(' · '):''}；仍保留最近一次成功导入的数据`}else if(importedAt){status.className='status';status.textContent=`已载入 ${rows.length} 条记录${duplicateCount?`（忽略重复 ${duplicateCount} 条）`:''} · ${parts.join(' · ')} · 再次导入会完整替换当前数据`}else{status.className='status';status.textContent='尚未导入数据。请选择 Notion 导出的 CSV 文件或文件夹。'}}

function normalizeCsv(file,text){let table=parseCsv(text);if(!table.length)return[];let headers=table[0],idx=Object.fromEntries(headers.map((h,i)=>[h,i])),get=(r,k)=>r[idx[k]]??'',cat=file.name.replace(/\.csv$/i,'').replace(/__.*$/,'');return table.slice(1).map((r,n)=>{let start=get(r,'Event Date Start'),end=get(r,'Event Date End'),d=Number(get(r,'Time allotted')),duration=get(r,'Time allotted').trim()!==''&&Number.isFinite(d)?d:null,startD=parseDate(start),endD=parseDate(end),calc=startD&&endD?(endD-startD)/3600000:null,issues=[];if(duration!==null&&duration<0)duration=null;if(duration===null&&calc!==null&&calc>=0)duration=calc;if(duration===null)issues.push('缺少有效时长');if(!startD)issues.push('日期缺失');if(duration!==null&&calc!==null&&Math.abs(duration-calc)>1/60)issues.push('时长与起止时间相差超过1分钟');if(startD&&endD&&endD<startD)issues.push('结束时间早于开始时间');return{id:get(r,'Page ID')||`${file.name}:${n}`,event:get(r,'Event')||'(未命名活动)',category:get(r,'Source Database')||cat,sourceDatabase:get(r,'Source Database')||cat,source:get(r,'Source Data Source')||file.name,pageId:get(r,'Page ID'),select:get(r,'Select'),start:startD,end:endD,startRaw:start,endRaw:end,duration,url:get(r,'Source URL'),wk:get(r,'WK #'),year:get(r,'Year'),issues}})}
async function importFiles(files){if(!files.length)return;try{let staged=[],dataFileCount=0,manifestTime='',syncInfo=null;for(let f of files){if(!f.name.toLowerCase().endsWith('.csv'))continue;let csvText=await f.text();if(f.name.toLowerCase()==='manifest.csv'){let m=parseCsv(csvText);manifestTime=m[1]?.[6]||manifestTime;continue}if(f.name.toLowerCase()==='sync_status.csv'){let m=parseCsv(csvText);if(m[1])syncInfo={status:m[1][0],checked_at:m[1][1],message:m[1][2]};continue}dataFileCount++;staged.push(...normalizeCsv(f,csvText))}if(!dataFileCount){if(syncInfo?.status==='failed'){syncAt=syncInfo.checked_at||syncAt;syncFailure=syncInfo.message||'未知错误';failure='';try{localStorage.setItem('timeDashboardSyncAt',syncAt);localStorage.setItem('timeDashboardSyncFailure',syncFailure)}catch{}setStatus();return}throw Error('所选内容中没有可导入的记录 CSV 文件')}let byId=new Map();for(let r of staged)byId.set(r.id,r);duplicateCount=staged.length-byId.size;staged=[...byId.values()];overlaps(staged);rows=staged;importedAt=new Date().toISOString();failure='';syncAt=syncInfo?.checked_at||manifestTime||syncAt;syncFailure=syncInfo?.status==='failed'?(syncInfo.message||'未知错误'):'';try{localStorage.setItem('timeDashboardData',JSON.stringify(rows.map(serialRow)));localStorage.setItem('timeDashboardImportedAt',importedAt);localStorage.setItem('timeDashboardSyncAt',syncAt);localStorage.setItem('timeDashboardSyncFailure',syncFailure);localStorage.removeItem('timeDashboardFailure')}catch(e){failure='数据已载入本次页面，但浏览器存储空间不足，关闭页面后不会保留'}setStatus();draw()}catch(e){failure=e.message||String(e);try{localStorage.setItem('timeDashboardFailure',failure)}catch{}setStatus()}}
function serialRow(r){return {...r,start:r.start?.toISOString()||null,end:r.end?.toISOString()||null}}
function restore(){try{let data=localStorage.getItem('timeDashboardData');importedAt=localStorage.getItem('timeDashboardImportedAt')||'';failure=localStorage.getItem('timeDashboardFailure')||'';syncAt=localStorage.getItem('timeDashboardSyncAt')||'';syncFailure=localStorage.getItem('timeDashboardSyncFailure')||'';if(data){rows=JSON.parse(data).map(r=>({...r,start:parseDate(r.start),end:parseDate(r.end)}));overlaps(rows)}}catch(e){failure='无法读取浏览器保存的数据：'+e.message}setStatus();draw()}
app.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ring-segment,.stack-segment,svg g[data-cat]')){e.preventDefault();e.target.click()}};
$('#pickFiles').onclick=()=>$('#files').click();$('#pickFolder').onclick=()=>$('#folder').click();$('#files').onchange=e=>importFiles([...e.target.files]);$('#folder').onchange=e=>importFiles([...e.target.files]);$('#range').onchange=()=>{$('#custom').classList.toggle('hidden',$('#range').value!=='custom');if($('#range').value==='default')selectedRing='yesterday';draw()};$('#category').onchange=draw;$('#from').onchange=draw;$('#to').onchange=draw;
$('#exportCsv').onclick=()=>{let list=chosenRows(),header=['开始时间','结束时间','活动','类别（CSV）','Select','源数据库','页面ID','时长（小时）','WK #','Year','异常','Notion链接'];let lines=[header,...list.map(r=>[r.start?.toLocaleString('zh-CN')||'',r.end?.toLocaleString('zh-CN')||'',r.event,r.category,r.select,r.sourceDatabase,r.pageId,r.duration===null?'':fmt(r.duration),r.wk,r.year,r.issues.join('；'),r.url])].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='时间使用分析明细.csv';a.click();URL.revokeObjectURL(a.href)};
restore();
if(location.protocol==='http:'&&location.hostname==='127.0.0.1'){
  $('#pickFiles').classList.add('hidden');$('#pickFolder').classList.add('hidden');
  (async()=>{try{let [dataRes,statusRes,colorRes]=await Promise.all([fetch('/api/data',{cache:'no-store'}),fetch('/api/status',{cache:'no-store'}),fetch('/api/colors',{cache:'no-store'})]);if(!dataRes.ok||!statusRes.ok)throw Error('无法读取本机最新导出');if(colorRes.ok){let saved=parseCsv(await colorRes.text());if(saved.length>1){categoryColors=Object.fromEntries(saved.slice(1).filter(r=>r[0]&&r[1]).map(r=>[r[0],r[1]]));loadAllocation();updateAllocationToggle();applyTheme(categoryColors[themeSettingKey]===darkThemeMarker?'dark':'light')}}let payload=await dataRes.json(),info=await statusRes.json(),files=(payload.files||[]).map(x=>({name:x.name,text:async()=>x.csv}));files.push({name:'manifest.csv',text:async()=>[['Database','Database ID','Data Source','Data Source ID','Rows','CSV File','Exported At'],...(info.manifest||[]).map(x=>[x.Database,x['Database ID'],x['Data Source'],x['Data Source ID'],x.Rows,x['CSV File'],x['Exported At']])].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')},{name:'sync_status.csv',text:async()=>[['status','checked_at','message'],[info.sync?.status||'',info.sync?.checked_at||'',info.sync?.message||'']].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')});if(files.length>2)await importFiles(files);else{syncAt=info.sync?.checked_at||'';syncFailure=info.sync?.status==='failed'?(info.sync.message||'未知错误'):'导出目录中没有数据文件';failure='';setStatus();draw()}}catch(e){failure='自动载入失败：'+(e.message||e);setStatus()}})();
}
})();
